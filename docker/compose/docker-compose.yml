version: '3.3'
services:
  db:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_PASSWORD: '123456'
      MYSQL_ROOT_PASSWORD: '123456'
    ports:
      - "3306:3306"
    volumes:
      - /usr/local/mysql/log:/var/log/mysql
      - /usr/local/mysql/data:/var/lib/mysql
    restart: always
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data:/data
      - ./config:/root/.minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9009:9009"
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/log:/var/log/clickhouse-server
    restart: always
#    environment:
#      CLICKHOUSE_PASSWORD: "123456"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
