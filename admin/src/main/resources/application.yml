spring:
  # 激活的环境配置
  profiles:
    active: dev
  #文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB        # 单个文件最大大小
      max-request-size: 50MB     # 单次请求最大文件大小
  # 数据源配置（configdb库）
  datasource:
    configdb:
      driver-class-name: com.mysql.cj.jdbc.Driver
      max-active: 10             # 连接池最大活跃连接数
      max-idle: 5                # 连接池最大空闲连接数
      min-idle: 0                # 连接池最小空闲连接数


  # 关闭Spring Boot启动banner
  main:
    banner-mode: off
  # JPA/Hibernate配置
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect  # MySQL方言
    show-sql: false                                   # 关闭SQL打印
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl  # 物理表名策略

# 日志配置
log:
  path: "./logs"  # 日志存放路径

# 自定义应用配置
app:
  anonymousClientIp: 127.0.0.1;192.168.0.1/24  # 匿名客户端IP白名单
